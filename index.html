<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bobby Singer Archive</title>

<style>

body{
background:url("background.jpeg") center/cover no-repeat fixed;
color:#8fe9ff;
font-family:Courier New, monospace;
margin:0;
padding:40px;
}

/* затемнение без перекрытия картинки */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* скан линии */

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:repeating-linear-gradient(
transparent,
transparent 2px,
rgba(0,0,0,0.3) 3px
);
pointer-events:none;
}

h1{
color:#b8f2ff;
text-shadow:0 0 12px #3bdfff;
}

.folder{
margin-top:25px;
}

.file{
margin-left:20px;
cursor:pointer;
}

.file:hover{
color:white;
}

#content{
margin-top:30px;
border-top:1px solid #8fe9ff;
padding-top:20px;
min-height:260px;
}

/* терминал */

#terminal{
margin-top:40px;
border:1px solid #8fe9ff;
padding:15px;
background:black;
}

#terminalInput{
width:100%;
background:black;
border:none;
color:#8fe9ff;
outline:none;
font-family:Courier New;
}

/* панель кнопок */

#controlPanel{
position:fixed;
right:20px;
top:30px;
display:flex;
flex-direction:column;
gap:10px;
}

.panelButton{
background:black;
border:1px solid #8fe9ff;
color:#8fe9ff;
padding:8px;
cursor:pointer;
}

.panelButton:hover{
background:#8fe9ff;
color:black;
}

/* аудио панель */

#audioPanel{
display:none;
background:black;
border:1px solid #8fe9ff;
padding:10px;
}

/* подсказки */

#hintBox{
display:none;
position:fixed;
bottom:30px;
right:30px;
background:black;
border:1px solid #8fe9ff;
padding:15px;
max-width:260px;
}

</style>
</head>

<body>

<h1>BOBBY SINGER ARCHIVE</h1>
<p>Recovered hunter database. Multiple files encrypted.</p>

<div class="folder">

<strong>MONSTERS</strong>

<div class="file" onclick="openFile('vampire')">vampire.txt</div>
<div class="file" onclick="openFile('wendigo')">wendigo.txt</div>
<div class="file" onclick="openFile('ghost')">ghost.txt</div>
<div class="file" onclick="openFile('shapeshifter')">shapeshifter.txt</div>
<div class="file" onclick="openFile('demon')">demon.txt</div>
<div class="file" onclick="openFile('werewolf')">werewolf.txt</div>
<div class="file" onclick="openFile('ghoul')">ghoul.txt</div>
<div class="file" onclick="openFile('reaper')">reaper.txt</div>
<div class="file" onclick="openFile('angel')">angel.txt</div>
<div class="file" onclick="openFile('leviathan')">leviathan.txt</div>

</div>

<div class="folder">

<strong>ENCRYPTED CASE</strong>

<div class="file" onclick="openFile('locked')">case_blackwater.txt</div>

</div>

<div id="content"></div>

<!-- терминал -->

<div id="terminal">

<p>> hunter_terminal.exe</p>

<div id="terminalLog"></div>

<input id="terminalInput" placeholder="type command...">

</div>

<!-- панель управления -->

<div id="controlPanel">

<button class="panelButton" onclick="toggleAudio()">🔊 Audio</button>
<button class="panelButton" onclick="showHint()">💡 Hint</button>

<div id="audioPanel">

<button onclick="music.play()">Play</button>

<br><br>

Volume

<br>

<input type="range" min="0" max="1" step="0.01" value="0.3"
oninput="music.volume=this.value">

</div>

</div>

<div id="hintBox"></div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

let music=document.getElementById("music")

function toggleAudio(){

let panel=document.getElementById("audioPanel")

panel.style.display=
panel.style.display==="block"?"none":"block"

}

/* ФАЙЛЫ */

function openFile(type){

let c=document.getElementById("content")

if(type==="vampire"){
c.innerHTML=`
<h2>VAMPIRE</h2>

<p>Ancient predators feeding on human blood. 
Often form nests and hunt in coordinated packs.</p>

<p>Known signs:</p>
<p>- drained victims</p>
<p>- fang punctures</p>
<p>- missing persons near abandoned buildings</p>

<p>Weakness: silver blade.</p>

<p>Encrypted note:</p>
<p>YLPSLUH</p>

<p>Hint inside archive.</p>
`
}

if(type==="wendigo"){
c.innerHTML=`
<h2>WENDIGO</h2>

<p>Spirit of endless hunger originating in northern forests.</p>

<p>Hunting pattern: stalk prey for days before attack.</p>

<p>Weakness: fire.</p>

<p>Note: creatures move extremely fast in trees.</p>
`
}

if(type==="ghost"){
c.innerHTML=`
<h2>GHOST</h2>

<p>Human spirit trapped between worlds.</p>

<p>Usually tied to unfinished business or remains.</p>

<p>Method: burn bones.</p>

<p>Hidden message:</p>

<p>
Dark<br>
Old<br>
Crows<br>
Kings
</p>
`
}

if(type==="shapeshifter"){
c.innerHTML=`
<h2>SHAPESHIFTER</h2>

<p>Creature able to mimic humans perfectly.</p>

<p>Evidence: discarded skin.</p>

<p>Anagram:</p>

<p>RIGOENDW</p>
`
}

if(type==="demon"){
c.innerHTML=`
<h2>DEMON</h2>

<p>Possessing entity from Hell.</p>

<p>Weakness: devil's trap and exorcism.</p>

<p>Latin ritual fragment recorded:</p>

<p>Exorcizamus te omnis immundus spiritus...</p>
`
}

if(type==="werewolf"){
c.innerHTML=`<h2>WEREWOLF</h2><p>Transformed predator. Silver bullet required.</p>`
}

if(type==="ghoul"){
c.innerHTML=`<h2>GHOUL</h2><p>Corpse eater capable of impersonation.</p>`
}

if(type==="reaper"){
c.innerHTML=`<h2>REAPER</h2><p>Guide of souls to afterlife.</p>`
}

if(type==="angel"){
c.innerHTML=`<h2>ANGEL</h2><p>Celestial being powered by grace.</p>`
}

if(type==="leviathan"){
c.innerHTML=`<h2>LEVIATHAN</h2><p>Ancient creatures predating angels.</p>`
}

if(type==="locked"){

c.innerHTML=`

<h2>ENCRYPTED FILE</h2>

<p>Password required</p>

<input id="pass">
<button onclick="checkPass()">Decrypt</button>

`

}

}

/* пароль */

function checkPass(){

let p=document.getElementById("pass").value.toLowerCase()
let c=document.getElementById("content")

if(p==="silver"){

c.innerHTML=`

<h2>CASE BLACKWATER</h2>

<p>Disappearances every 23 years.</p>

<p>Final code: 23-3-14</p>

<p>Use terminal decode.</p>

`

}else{

c.innerHTML="<p>ACCESS DENIED</p>"

}

}

/* терминал */

let input=document.getElementById("terminalInput")
let log=document.getElementById("terminalLog")

input.addEventListener("keypress",function(e){

if(e.key==="Enter"){

let cmd=input.value
input.value=""

log.innerHTML+="<p>> "+cmd+"</p>"

if(cmd==="help")
log.innerHTML+="<p>scan decode bunker</p>"

else if(cmd==="decode")
log.innerHTML+="<p>23-3-14 → W C N</p>"

else if(cmd==="bunker")
log.innerHTML+="<p>Men of Letters bunker unlocked</p>"

else
log.innerHTML+="<p>unknown command</p>"

}

})

/* подсказки */

let hints=[
"Caesar cipher may reveal monster name.",
"Anagrams hide inside shapeshifter files.",
"Ghost file hides message in first letters.",
"Silver is always useful against vampires.",
"Terminal command 'decode' may help."
]

let hintIndex=0

function showHint(){

let box=document.getElementById("hintBox")

box.style.display="block"

box.innerHTML=hints[hintIndex]

hintIndex++

if(hintIndex>=hints.length)
hintIndex=hints.length-1

}

</script>

</body>
</html>
