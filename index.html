<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bobby Singer Archive</title>

<style>

body{
background:url("background.jpeg") no-repeat center center fixed;
background-size:cover;
color:#8fe9ff;
font-family:Courier New, monospace;
margin:0;
padding:40px;
}

/* затемнение */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
z-index:-1;
}

/* скан линии */

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:repeating-linear-gradient(
transparent,
transparent 2px,
rgba(0,0,0,0.35) 3px
);
pointer-events:none;
}

/* текст */

h1{
color:#b8f2ff;
text-shadow:0 0 10px #3bdfff;
}

.folder{
margin-top:25px;
}

.file{
margin-left:20px;
cursor:pointer;
}

.file:hover{
color:white;
}

/* окно контента */

#content{
margin-top:30px;
border-top:1px solid #8fe9ff;
padding-top:20px;
min-height:260px;
}

/* терминал */

#terminal{
margin-top:40px;
border:1px solid #8fe9ff;
padding:15px;
background:black;
}

#terminalInput{
width:100%;
background:black;
border:none;
color:#8fe9ff;
font-family:Courier New;
outline:none;
}

/* музыка */

#musicBox{
position:fixed;
right:20px;
top:30px;
background:black;
border:1px solid #8fe9ff;
padding:10px;
}

button{
background:black;
border:1px solid #8fe9ff;
color:#8fe9ff;
padding:6px 10px;
cursor:pointer;
}

button:hover{
background:#8fe9ff;
color:black;
}

input{
background:black;
border:1px solid #8fe9ff;
color:#8fe9ff;
}

</style>
</head>

<body>

<h1>BOBBY SINGER ARCHIVE</h1>
<p>Hunter database restored. Some files corrupted.</p>

<div class="folder">

<strong>MONSTERS</strong>

<div class="file" onclick="openFile('vampire')">vampire.txt</div>
<div class="file" onclick="openFile('wendigo')">wendigo.txt</div>
<div class="file" onclick="openFile('ghost')">ghost.txt</div>
<div class="file" onclick="openFile('shapeshifter')">shapeshifter.txt</div>
<div class="file" onclick="openFile('demon')">demon.txt</div>
<div class="file" onclick="openFile('angel')">angel.txt</div>
<div class="file" onclick="openFile('ghoul')">ghoul.txt</div>
<div class="file" onclick="openFile('werewolf')">werewolf.txt</div>
<div class="file" onclick="openFile('reaper')">reaper.txt</div>
<div class="file" onclick="openFile('leviathan')">leviathan.txt</div>

</div>

<div class="folder">

<strong>ENCRYPTED FILE</strong>

<div class="file" onclick="openFile('locked')">case_blackwater.txt</div>

</div>

<div id="content"></div>

<!-- ТЕРМИНАЛ -->

<div id="terminal">

<p>> hunter_terminal.exe</p>

<div id="terminalLog"></div>

<input id="terminalInput" placeholder="type command...">

</div>

<!-- музыка -->

<div id="musicBox">

<button onclick="startMusic()">PLAY AMBIENCE</button>

<br><br>

Volume

<br>

<input type="range" min="0" max="1" step="0.01" value="0.3" oninput="music.volume=this.value">

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* музыка */

let music=document.getElementById("music")

function startMusic(){
music.play()
}

/* файлы */

function openFile(type){

let c=document.getElementById("content")

if(type==="vampire"){
c.innerHTML=`
<h2>VAMPIRE</h2>
<p>Weakness: silver.</p>
<p>Encrypted clue: YLPSLUH</p>
<p>Hint: Caesar shift 3.</p>
`
}

if(type==="wendigo"){
c.innerHTML=`
<h2>WENDIGO</h2>
<p>Forest predator.</p>
<p>Weakness: fire.</p>
<p>Clue: coordinates hidden in cases.</p>
`
}

if(type==="ghost"){
c.innerHTML=`
<h2>GHOST</h2>
<p>Burn remains.</p>
<p>Hidden message:</p>
<p>
Dark<br>
Old<br>
Crows<br>
Kings
</p>
`
}

if(type==="shapeshifter"){
c.innerHTML=`
<h2>SHAPESHIFTER</h2>
<p>Anagram: RIGOENDW</p>
`
}

if(type==="demon"){
c.innerHTML=`
<h2>DEMON</h2>
<p>Exorcizamus te omnis immundus spiritus...</p>
`
}

if(type==="angel"){
c.innerHTML=`
<h2>ANGEL</h2>
<p>Grace entity.</p>
`
}

if(type==="ghoul"){
c.innerHTML=`
<h2>GHOUL</h2>
<p>Feeds on corpses.</p>
`
}

if(type==="werewolf"){
c.innerHTML=`
<h2>WEREWOLF</h2>
<p>Silver bullet required.</p>
`
}

if(type==="reaper"){
c.innerHTML=`
<h2>REAPER</h2>
<p>Guide of souls.</p>
`
}

if(type==="leviathan"){
c.innerHTML=`
<h2>LEVIATHAN</h2>
<p>Ancient creatures.</p>
`
}

if(type==="locked"){
c.innerHTML=`

<h2>ENCRYPTED FILE</h2>

<p>Password required</p>

<input id="pass">
<button onclick="checkPass()">decrypt</button>

<p>Hint: hunters use this against vampires.</p>

`
}

}

/* пароль */

function checkPass(){

let p=document.getElementById("pass").value.toLowerCase()
let c=document.getElementById("content")

if(p==="silver"){

c.innerHTML=`

<h2>CASE BLACKWATER</h2>

<p>Disappearances every 23 years.</p>

<p>Final code: 23-3-14</p>

<p>Use terminal command to decode.</p>

`

}else{

c.innerHTML="<p>ACCESS DENIED</p>"

}

}

/* ТЕРМИНАЛ */

let input=document.getElementById("terminalInput")
let log=document.getElementById("terminalLog")

input.addEventListener("keypress",function(e){

if(e.key==="Enter"){

let cmd=input.value
input.value=""

log.innerHTML+="<p>> "+cmd+"</p>"

process(cmd)

}

})

function process(cmd){

if(cmd==="help"){
log.innerHTML+="<p>commands: scan decode bunker</p>"
}

else if(cmd==="scan"){
log.innerHTML+="<p>scanning archive... monster patterns found.</p>"
}

else if(cmd==="decode"){
log.innerHTML+="<p>23-3-14 -> W C N</p>"
}

else if(cmd==="bunker"){
log.innerHTML+="<p>ACCESS GRANTED: Men of Letters bunker</p>"
}

else{
log.innerHTML+="<p>unknown command</p>"
}

}

</script>

</body>
</html>
