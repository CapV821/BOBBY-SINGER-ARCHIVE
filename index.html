<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bobby Singer Archive</title>

<style>
body{
  background-image:url("background.jpeg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#8fe9ff;
  font-family:Courier New, monospace;
  margin:0;
  padding:40px;
}
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
  z-index:-1;
}
h1{ text-shadow:0 0 12px #33e0ff; }
.folder{ margin-top:25px; }
.file{
  margin-left:20px;
  cursor:pointer;
  margin-top:6px;
}
.file:hover{ color:white; }

#content{
  margin-top:30px;
  border-top:1px solid #8fe9ff;
  padding-top:20px;
  min-height:260px;
}

/* панель */
#controlPanel{
  position:fixed;
  right:20px;
  top:30px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.panelButton{
  background:black;
  border:1px solid #8fe9ff;
  color:#8fe9ff;
  padding:8px;
  cursor:pointer;
}
.panelButton:hover{
  background:#8fe9ff;
  color:black;
}
#audioPanel{
  display:none;
  background:black;
  border:1px solid #8fe9ff;
  padding:10px;
}
#hintBox{
  display:none;
  position:fixed;
  bottom:30px;
  right:30px;
  background:black;
  border:1px solid #8fe9ff;
  padding:15px;
  max-width:280px;
}

/* загрузка */
#bootScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  color:#8fe9ff;
  font-family:Courier New, monospace;
  padding:40px;
  z-index:200;
}
#bootText{
  white-space:pre-line;
  margin-bottom:20px;
}

/* финал */
#finalScene{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  text-align:center;
  color:white;
  overflow:hidden;
}
#finalCar{
  display:block;
  margin-top:20px;
  width:120px;
  image-rendering:pixelated;
}

/* glitch */
.glitch{
  animation:glitch 0.2s infinite;
}
@keyframes glitch{
 0%{transform:translate(2px,0);}
 50%{transform:translate(-2px,0);}
 100%{transform:translate(2px,0);}
}

/* фотогалерея */
#galleryOverlay{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  z-index:400;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
#galleryOverlay img{
  max-width:80%; max-height:80%; margin-bottom:10px;
}
#galleryOverlay p{ color:#8fe9ff; }
</style>
</head>
<body>

<div id="bootScreen">
 <div id="bootText"></div>
 <div id="bootBarContainer">
    <div id="bootBar" style="width:0%; height:10px; background:#8fe9ff;"></div>
 </div>
</div>

<h1>BOBBY SINGER ARCHIVE</h1>
<p id="subtitle">Recovered hunter research database.</p>

<div class="folder">
  <strong id="monsterFolder">MONSTER FILES</strong>
  <div class="file" onclick="openFile('vampire')">vampire.txt</div>
  <div class="file" onclick="openFile('wendigo')">wendigo.txt</div>
  <div class="file" onclick="openFile('ghost')">ghost.txt</div>
  <div class="file" onclick="openFile('werewolf')">Оборотень / Werewolf.txt</div>
</div>

<div class="folder">
  <strong id="lockedFolder">LOCKED FILE</strong>
  <div class="file" onclick="openFinal()">unknown.txt</div>
</div>

<div class="folder">
  <strong>PHOTO ARCHIVE</strong>
  <div class="file" onclick="openGallery()">gallery</div>
  <div class="file" onclick="openDean()">photodeantinder.jpeg</div>
</div>

<div id="secretFolder"></div>
<div id="content"></div>

<div id="controlPanel">
  <button class="panelButton" onclick="toggleAudio()">🔊</button>
  <button class="panelButton" onclick="showHint()">💡</button>
  <button class="panelButton" onclick="toggleLang()">🌐</button>
  <div id="audioPanel">
    <button onclick="music.play()">Play</button><br><br>
    Volume<br>
    <input type="range" min="0" max="1" step="0.01" value="0.3" oninput="music.volume=this.value">
  </div>
</div>

<!-- звонок Вивиан -->
<div id="callScreen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:#8fe9ff; z-index:300; flex-direction:column; align-items:center; justify-content:center;">
<h2>Incoming Call...</h2>
<p>Vivian ♥</p>
<button onclick="endCall()">End Call</button>
</div>

<!-- фотогалерея -->
<div id="galleryOverlay">
  <img id="galleryImage" src="">
  <p id="galleryNote"></p>
  <div>
    <button onclick="prevImage()">⬅️</button>
    <button onclick="nextImage()">➡️</button>
    <button onclick="closeGallery()">Close</button>
  </div>
</div>

<audio id="clickSound"><source src="click.mp3"></audio>
<audio id="music" loop><source src="music.mp3"></audio>
<audio id="engine"><source src="engine.mp3"></audio>
<audio id="ringtone" loop><source src="ringtone.mp3"></audio>

<div id="finalScene">
 <h1>Happy Birthday Lucas</h1>
 <p>See you on the road, hunter.</p>
 <img src="impala.png" id="finalCar">
</div>

<script>
/* загрузка */
let bootLines=[
"BOOTING HUNTER TERMINAL...",
"Loading Bobby Singer Archive...",
"Checking salt rounds...",
"Checking silver weapons...",
"Scanning monster database...",
"Accessing Men of Letters backup...",
"Decrypting hunter files...",
"Archive ready."
];
let bootIndex=0;
function bootSequence(){
 let text=document.getElementById("bootText");
 let bar=document.getElementById("bootBar");
 if(bootIndex<bootLines.length){
   text.innerHTML+=bootLines[bootIndex]+"\n";
   bar.style.width=((bootIndex+1)/bootLines.length*100)+"%";
   bootIndex++;
   setTimeout(bootSequence,700);
 } else {
   setTimeout(()=>{document.getElementById("bootScreen").style.display="none"},800);
 }
}
window.onload=bootSequence;

/* звук щелчка */
function clickSound(){
 let s=document.getElementById("clickSound");
 s.currentTime=0;
 s.play();
}

/* музыка */
let music=document.getElementById("music");
function toggleAudio(){
 let panel=document.getElementById("audioPanel");
 panel.style.display = panel.style.display==="block" ? "none" : "block";
}

/* перевод */
let lang="en";
function toggleLang(){
 clickSound();
 lang = (lang==="en")?"ru":"en";
 document.getElementById("subtitle").innerText = (lang==="ru")?"Архив охотника Бобби Сингера.":"Recovered hunter research database.";
 document.getElementById("monsterFolder").innerText = (lang==="ru")?"ФАЙЛЫ МОНСТРОВ":"MONSTER FILES";
 document.getElementById("lockedFolder").innerText = (lang==="ru")?"ЗАШИФРОВАННЫЙ ФАЙЛ":"LOCKED FILE";
}

/* файлы */
function openFile(type){
 clickSound();
 let c=document.getElementById("content");
 if(type==="vampire"){
 c.innerHTML=`
 <h2>VAMPIRE / Вампир</h2>
 <p>Vampires live in nests and replace missing people quietly.</p>
 <p>Weakness: silver blade.</p>
 <p>Bobby left coded word:</p>
 <b>MDCCY</b>
 <p>Old hunters used Caesar cipher (shift 5).</p>
 `;
 }
 if(type==="wendigo"){
 c.innerHTML=`
 <h2>WENDIGO / Вендиго</h2>
 <p>Ancient cannibal spirit living in forests.</p>
 <p>Bobby left scrambled letters:</p>
 <b>YTRHDABRI</b>
 <p>Try an anagram!</p>
 `;
 }
 if(type==="ghost"){
 c.innerHTML=`
 <h2>GHOST / Призрак</h2>
 <p>Lonely<br>Unfinished<br>Cold<br>Angry<br>Spirits</p>
 `;
 }
 if(type==="werewolf"){
 c.innerHTML=`
 <h2>ОБОРОТЕНЬ / WEREWOLF</h2>
 <p>Random notes Bobby accidentally saved here:</p>
 <ul>
 <li>Check salt traps at full moon.</li>
 <li>Don’t forget holy water in first aid kit.</li>
 <li>Random number: 42</li>
 <li>Dean, fix this! Don’t be lazy!</li>
 </ul>
 `;
 }
}

/* финальный файл */
function openFinal(){
 clickSound();
 document.getElementById("content").innerHTML=`
 <h2>unknown.txt</h2>
 <p>Enter password:</p>
 <p><i>hunter-word_word_word</i></p>
 <input id="finalPass">
 <button onclick="checkFinal()">Decrypt</button>
 `;
}
function checkFinal(){
 let pass=document.getElementById("finalPass").value.toLowerCase();
 if(pass==="hunter-happy_birthday_lucas"){
 document.getElementById("content").innerHTML=`
 <h2>unknown.txt</h2>
 <p>Sam. Dean.</p>
 <p>If you're reading this, someone managed to break into my archive.</p>
 <p>Name's Lucas Castro.</p>
 <img src="profile.png" style="width:120px; border:1px solid #8fe9ff; margin-bottom:10px;">
 <p>Kid solved every damn lock I left here, so I guess that makes him a hunter now.</p>
 <p>Funny thing is — looks like it happened on his birthday.</p>
 <p>I managed to make it clean and deleted all case files from FBI system. Kiddo is a tough guy, so first things first.</p>
 <h3>Hunter starter kit</h3>
 <ul>
 <li>Silver knife</li>
 <li>Salt shells</li>
 <li>EMF reader</li>
 <li>Holy water</li>
 <li>Devil's trap chalk</li>
 <li>Fake FBI badge</li>
 </ul>
 <p><b>Bobby's note:</b></p>
 <p>Dean — buy the kid pizza. He deserves it.</p>
 <button onclick="unlockVivian()">Open next file</button>
 `;
 } else {
 document.body.classList.add("glitch");
 setTimeout(()=>{document.body.classList.remove("glitch")},800);
 alert("Access denied");
 }
}

/* Вивиан */
function unlockVivian(){
 document.getElementById("secretFolder").innerHTML=`
 <div class="folder">
 <strong>PRIVATE MESSAGE</strong>
 <div class="file" onclick="openVivian()">vivian_message.txt</div>
 </div>
 `;
}
function openVivian(){
 clickSound();
 document.getElementById("content").innerHTML=`
 <h2>vivian_message.txt</h2>
 <p>Lucas.</p>
 <p>You solved Bobby's archive. I knew you would.</p>
 <p>Congratulations on becoming a hunter.</p>
 <p>And happy birthday.</p>
 <p>When the party ends, I want to take you somewhere.</p>
 <p>A quiet highway outside the city.</p>
 <p>We'll take the Impala, roll down the windows and drive under a sky full of stars.</p>
 <p>No monsters. No hunting. Just the road and you.</p>
 <p>Call me.</p>
 <p><b style="cursor:pointer;" onclick="startCall()">📞 +1-913-555-1972</b></p>
 <p>— Vivian ♥</p>
 <button onclick="finalScene()">Finish</button>
 `;
}

/* звонок Вивиан */
function startCall(){
 clickSound();
 let screen=document.getElementById("callScreen");
 let ring=document.getElementById("ringtone");
 screen.style.display="flex";
 ring.play();
 setTimeout(()=>{
 screen.innerHTML=`
 <h2>Vivian ♥</h2>
 <p>Hey... you actually called.</p>
 <p>I was hoping you would.</p>
 <p>Get ready. I'm coming to pick you up.</p>
 <button onclick="endCall()">End Call</button>
 `;
 },4000);
}
function endCall(){
 document.getElementById("callScreen").style.display="none";
 document.getElementById("ringtone").pause();
}

/* фотогалерея */
let galleryFiles = [
  {src:"photo1.jpeg", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"photo2.jpeg", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"photo3.jpeg", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"photo4.jpeg", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"photo5.jpeg", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"gif1.gif", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"gif2.gif", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"gif3.gif", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"gif4.gif", note:"Дин, пожалуйста, перестань страдать херней в логове."},
  {src:"gif5.gif", note:"Дин, пожалуйста, перестань страдать херней в логове."},
];

let galleryIndex = 0;
function openGallery(){
 clickSound();
 galleryIndex=0;
 document.getElementById("galleryOverlay").style.display="flex";
 showGalleryImage();
}
function showGalleryImage(){
 let file = galleryFiles[galleryIndex];
 document.getElementById("galleryImage").src = file.src;
 document.getElementById("galleryNote").innerText = file.note;
}
function nextImage(){
 galleryIndex = (galleryIndex+1) % galleryFiles.length;
 showGalleryImage();
}
function prevImage(){
 galleryIndex = (galleryIndex-1 + galleryFiles.length) % galleryFiles.length;
 showGalleryImage();
}
function closeGallery(){
 document.getElementById("galleryOverlay").style.display="none";
}

/* фотка Дина с Tinder */
function openDean(){
 clickSound();
 document.getElementById("content").innerHTML=`
 <h2>photodeantinder.jpeg</h2>
 <img src="photodeantinder.jpeg" style="max-width:80%; margin-bottom:10px;">
 <p>Bobby: Случайно наткнулся на тиндер Дина 😆 Сэмми, не дай бог, не узнает!</p>
 `;
}

/* финал */
function finalScene(){
 document.getElementById("finalScene").style.display="flex";
 document.getElementById("engine").play();
}
</script>
</body>
</html>
