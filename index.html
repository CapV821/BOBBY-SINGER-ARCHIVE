<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bobby Singer Archive</title>
<style>
body{
  background-image:url("background.jpeg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#8fe9ff;
  font-family:Courier New, monospace;
  margin:0;
  padding:40px;
}
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
  z-index:-1;
}
h1{ text-shadow:0 0 12px #33e0ff; }
.folder{ margin-top:25px; }
.file{
  margin-left:20px;
  cursor:pointer;
  margin-top:6px;
}
.file:hover{ color:white; }

#content{
  margin-top:30px;
  border-top:1px solid #8fe9ff;
  padding-top:20px;
  min-height:260px;
}

/* панель */
#controlPanel{
  position:fixed;
  right:20px;
  top:30px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.panelButton{
  background:black;
  border:1px solid #8fe9ff;
  color:#8fe9ff;
  padding:8px;
  cursor:pointer;
}
.panelButton:hover{
  background:#8fe9ff;
  color:black;
}
#audioPanel{
  display:none;
  background:black;
  border:1px solid #8fe9ff;
  padding:10px;
}
#hintBox{
  display:none;
  position:fixed;
  bottom:30px;
  right:30px;
  background:black;
  border:1px solid #8fe9ff;
  padding:15px;
  max-width:280px;
}

/* загрузка */
#bootScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  color:#8fe9ff;
  font-family:Courier New, monospace;
  padding:40px;
  z-index:200;
}
#bootText{
  white-space:pre-line;
  margin-bottom:20px;
}

/* финал */
#finalScene{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  text-align:center;
  color:white;
  overflow:hidden;
}
#finalCar{
  display:block;
  margin-top:20px;
  width:120px;
  image-rendering:pixelated;
}

/* glitch */
.glitch{
  animation:glitch 0.2s infinite;
}
@keyframes glitch{
 0%{transform:translate(2px,0);}
 50%{transform:translate(-2px,0);}
 100%{transform:translate(2px,0);}
}

/* фотогалерея */
#galleryOverlay{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  z-index:400;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
#galleryOverlay img{
  max-width:80%; max-height:80%; margin-bottom:10px;
}
#galleryOverlay p{ color:#8fe9ff; }

/* звезды */
.star{
  position:absolute;
  background:white;
  border-radius:50%;
  width:2px;
  height:2px;
  opacity:0.8;
  animation: twinkle 2s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.8;}
  50%{opacity:0.2;}
}
</style>
</head>
<body>

<div id="bootScreen">
 <div id="bootText"></div>
 <div id="bootBarContainer">
    <div id="bootBar" style="width:0%; height:10px; background:#8fe9ff;"></div>
 </div>
</div>

<h1>BOBBY SINGER ARCHIVE</h1>
<p id="subtitle">Recovered hunter research database.</p>

<div class="folder">
  <strong id="monsterFolder">MONSTER FILES</strong>
  <div class="file" onclick="openFile('vampire')">vampire.txt</div>
  <div class="file" onclick="openFile('wendigo')">wendigo.txt</div>
  <div class="file" onclick="openFile('ghost')">ghost.txt</div>
  <div class="file" onclick="openFile('werewolf')">Оборотень / Werewolf.txt</div>
</div>

<div class="folder">
  <strong id="lockedFolder">LOCKED FILE</strong>
  <div class="file" onclick="openFinal()">unknown.txt</div>
</div>

<div class="folder">
  <strong>PHOTO ARCHIVE</strong>
  <div class="file" onclick="openGallery()">gallery</div>
  <div class="file" onclick="openDean()">photodeantinder.jpeg</div>
</div>

<div id="secretFolder"></div>
<div id="content"></div>

<div id="controlPanel">
  <button class="panelButton" onclick="toggleAudio()">🔊</button>
  <button class="panelButton" onclick="showHint()">💡</button>
  <button class="panelButton" onclick="toggleLang()">🌐</button>
  <div id="audioPanel">
    <button onclick="music.play()">Play</button><br><br>
    Volume<br>
    <input type="range" min="0" max="1" step="0.01" value="0.3" oninput="music.volume=this.value">
  </div>
</div>

<!-- звонок Вивиан -->
<div id="callScreen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:#8fe9ff; z-index:300; flex-direction:column; align-items:center; justify-content:center;">
<h2>Incoming Call...</h2>
<p>Vivian ♥</p>
<button onclick="endCall()">End Call</button>
</div>

<!-- фотогалерея -->
<div id="galleryOverlay">
  <img id="galleryImage" src="">
  <p id="galleryNote"></p>
  <div>
    <button onclick="prevImage()">⬅️</button>
    <button onclick="nextImage()">➡️</button>
    <button onclick="closeGallery()">Close</button>
  </div>
</div>

<audio id="clickSound"><source src="click.mp3"></audio>
<audio id="music" loop><source src="music.mp3"></audio>
<audio id="engine"><source src="engine.mp3"></audio>
<audio id="ringtone" loop><source src="ringtone.mp3"></audio>

<div id="finalScene">
 <h1>Happy Birthday Lucas</h1>
 <p>See you on the road, hunter.</p>
 <img src="impala.png" id="finalCar">
</div>

<script>
/* загрузка */
let bootLines=[
"BOOTING HUNTER TERMINAL...",
"Loading Bobby Singer Archive...",
"Checking salt rounds...",
"Checking silver weapons...",
"Scanning monster database...",
"Accessing Men of Letters backup...",
"Decrypting hunter files...",
"Archive ready."
];
let bootIndex=0;
function bootSequence(){
 let text=document.getElementById("bootText");
 let bar=document.getElementById("bootBar");
 if(bootIndex<bootLines.length){
   text.innerHTML+=bootLines[bootIndex]+"\n";
   bar.style.width=((bootIndex+1)/bootLines.length*100)+"%";
   bootIndex++;
   setTimeout(bootSequence,700);
 } else {
   setTimeout(()=>{document.getElementById("bootScreen").style.display="none"},800);
 }
}
window.onload=bootSequence;

/* звук щелчка */
function clickSound(){
 let s=document.getElementById("clickSound");
 s.currentTime=0;
 s.play();
}

/* музыка */
let music=document.getElementById("music");
function toggleAudio(){
 let panel=document.getElementById("audioPanel");
 panel.style.display = panel.style.display==="block" ? "none" : "block";
}

/* многоязычные тексты */
let texts = {
 en:{
   subtitle:"Recovered hunter research database.",
   monsterFolder:"MONSTER FILES",
   lockedFolder:"LOCKED FILE",
   files:{
     vampire:`<h2>VAMPIRE / Vampire</h2>
<p>Vampires live in nests and replace missing people quietly.</p>
<p>Weakness: silver blade.</p>
<p>Bobby left coded word:</p><b>MDCCY</b>
<p>Old hunters used Caesar cipher (shift 5).</p>`,
     wendigo:`<h2>WENDIGO / Wendigo</h2>
<p>Ancient cannibal spirit living in forests.</p>
<p>Bobby left scrambled letters:</p><b>YTRHDABRI</b><p>Try an anagram!</p>`,
     ghost:`<h2>GHOST / Ghost</h2>
<p>Lonely<br>Unfinished<br>Cold<br>Angry<br>Spirits</p>`,
     werewolf:`<h2>WEREWOLF / Werewolf</h2>
<p>Random notes Bobby accidentally saved here:</p>
<ul>
<li>Check salt traps at full moon.</li>
<li>Don’t forget holy water in first aid kit.</li>
<li>Random number: 42</li>
<li>Dean, fix this! Don’t be lazy!</li>
</ul>`
   }
 },
 ru:{
   subtitle:"Архив охотника Бобби Сингера.",
   monsterFolder:"ФАЙЛЫ МОНСТРОВ",
   lockedFolder:"ЗАШИФРОВАННЫЙ ФАЙЛ",
   files:{
     vampire:`<h2>Вампир / Vampire</h2>
<p>Вампиры живут в гнёздах и тихо заменяют пропавших людей.</p>
<p>Слабость: серебряный клинок.</p>
<p>Бобби оставил закодированное слово:</p><b>MDCCY</b>
<p>Старые охотники использовали шифр Цезаря (сдвиг 5).</p>`,
     wendigo:`<h2>Вендиго / Wendigo</h2>
<p>Древний каннибальский дух, живущий в лесах.</p>
<p>Бобби оставил перепутанные буквы:</p><b>YTRHDABRI</b><p>Попробуй анаграмму!</p>`,
     ghost:`<h2>Призрак / Ghost</h2>
<p>Одинокий<br>Незавершённый<br>Холодный<br>Злой<br>Дух</p>`,
     werewolf:`<h2>Оборотень / Werewolf</h2>
<p>Случайные заметки Бобби:</p>
<ul>
<li>Проверить соляные ловушки при полной луне.</li>
<li>Не забудь святую воду в аптечке.</li>
<li>Случайное число: 42</li>
<li>Дин, исправь это! Не ленись!</li>
</ul>`
   }
 }
};

let lang="en";
function toggleLang(){
 clickSound();
 lang = (lang==="en")?"ru":"en";
 document.getElementById("subtitle").innerText = texts[lang].subtitle;
 document.getElementById("monsterFolder").innerText = texts[lang].monsterFolder;
 document.getElementById("lockedFolder").innerText = texts[lang].lockedFolder;
 // обновляем открытый файл
 let c = document.getElementById("content");
 if(c.dataset.fileType && texts[lang].files[c.dataset.fileType]){
   c.innerHTML = texts[lang].files[c.dataset.fileType];
 }
}

function openFile(type){
 clickSound();
 let c = document.getElementById("content");
 c.dataset.fileType = type;
 if(texts[lang].files[type]){
   c.innerHTML = texts[lang].files[type];
 }
}

/* фотогалерея */
let galleryFiles = [
  {src:"photo1.jpeg", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"photo2.jpeg", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"photo3.jpeg", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"photo4.jpeg", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"photo5.jpeg", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"gif1.gif", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"gif2.gif", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"gif3.gif", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"gif4.gif", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"gif5.gif", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
];

let galleryIndex = 0;
function openGallery(){
  clickSound();
  galleryIndex=0;
  document.getElementById("galleryOverlay").style.display="flex";
  showGalleryImage();
}
function showGalleryImage(){
  let file = galleryFiles[galleryIndex];
  document.getElementById("galleryImage").src = file.src;
  document.getElementById("galleryNote").innerText = file.note;
}
function nextImage(){
  galleryIndex = (galleryIndex+1) % galleryFiles.length;
  showGalleryImage();
}
function prevImage(){
  galleryIndex = (galleryIndex-1 + galleryFiles.length) % galleryFiles.length;
  showGalleryImage();
}
function closeGallery(){
  document.getElementById("galleryOverlay").style.display="none";
}

/* остальной код (финалы, звонки, неизвестный файл) без изменений */

// финал со звёздами
function finalScene(){
 document.getElementById("finalScene").style.display="flex";
 document.getElementById("engine").play();
 createStars(100);
}
function createStars(count){
 for(let i=0;i<count;i++){
   let s = document.createElement("div");
   s.className="star";
   s.style.left=Math.random()*window.innerWidth+"px";
   s.style.top=Math.random()*window.innerHeight+"px";
   s.style.width=Math.random()*2+1+"px";
   s.style.height=s.style.width;
   s.style.animationDuration=(Math.random()*2+1)+"s";
   document.body.appendChild(s);
 }
}
</script>
</body>
</html>
