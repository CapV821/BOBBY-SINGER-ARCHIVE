<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bobby Singer Archive</title>

<style>
body{
  background-image:url("background.jpeg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#8fe9ff;
  font-family:Courier New, monospace;
  margin:0;
  padding:40px;
}
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
  z-index:-1;
}
h1{ text-shadow:0 0 12px #33e0ff; }
.folder{ margin-top:25px; }
.file{
  margin-left:20px;
  cursor:pointer;
  margin-top:6px;
}
.file:hover{ color:white; }

#content{
  margin-top:30px;
  border-top:1px solid #8fe9ff;
  padding-top:20px;
  min-height:260px;
}

/* панель */
#controlPanel{
  position:fixed;
  right:20px;
  top:30px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.panelButton{
  background:black;
  border:1px solid #8fe9ff;
  color:#8fe9ff;
  padding:8px;
  cursor:pointer;
}
.panelButton:hover{
  background:#8fe9ff;
  color:black;
}
#audioPanel{
  display:none;
  background:black;
  border:1px solid #8fe9ff;
  padding:10px;
}
#hintBox{
  display:none;
  position:fixed;
  bottom:30px;
  right:30px;
  background:black;
  border:1px solid #8fe9ff;
  padding:15px;
  max-width:280px;
  z-index:500;
}

/* загрузка */
#bootScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  color:#8fe9ff;
  font-family:Courier New, monospace;
  padding:40px;
  z-index:200;
}
#bootText{
  white-space:pre-line;
  margin-bottom:20px;
}

/* финал */
#finalScene{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  text-align:center;
  color:white;
  overflow:hidden;
}
#finalCar{
  display:block;
  margin-top:20px;
  width:120px;
  image-rendering:pixelated;
}

/* glitch */
.glitch{
  animation:glitch 0.2s infinite;
}
@keyframes glitch{
 0%{transform:translate(2px,0);}
 50%{transform:translate(-2px,0);}
 100%{transform:translate(2px,0);}
}

/* фотогалерея */
#galleryOverlay{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  z-index:400;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
#galleryOverlay img{
  max-width:80%; max-height:80%; margin-bottom:10px;
}
#galleryOverlay p{ color:#8fe9ff; }

/* звезды */
.star{
  position:absolute;
  background:white;
  border-radius:50%;
  width:2px;
  height:2px;
  opacity:0.8;
  animation: twinkle 2s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.8;}
  50%{opacity:0.2;}
}
</style>
</head>
<body>

<div id="bootScreen">
 <div id="bootText"></div>
 <div id="bootBarContainer">
    <div id="bootBar" style="width:0%; height:10px; background:#8fe9ff;"></div>
 </div>
</div>

<h1>BOBBY SINGER ARCHIVE</h1>
<p id="subtitle">Recovered hunter research database.</p>

<div class="folder">
  <strong id="monsterFolder">MONSTER FILES</strong>
  <div class="file" onclick="openFile('vampire')">vampire.txt</div>
  <div class="file" onclick="openFile('wendigo')">wendigo.txt</div>
  <div class="file" onclick="openFile('ghost')">ghost.txt</div>
  <div class="file" onclick="openFile('werewolf')">werewolf.txt</div>
</div>

<div class="folder">
  <strong id="lockedFolder">LOCKED FILE</strong>
  <div class="file" onclick="openFinal()">unknown.txt</div>
</div>

<div class="folder">
  <strong id="photoFolder">PHOTO ARCHIVE</strong>
  <div class="file" onclick="openGallery()">gallery</div>
  <div class="file" onclick="openDean()">photodeantinder.jpeg</div>
</div>

<div id="secretFolder"></div>
<div id="content"></div>

<div id="controlPanel">
  <button class="panelButton" onclick="toggleAudio()">🔊</button>
  <button class="panelButton" onclick="showHint()">💡</button>
  <button class="panelButton" onclick="toggleLang()">🌐</button>
  <div id="audioPanel">
    <button onclick="music.play()">Play</button><br><br>
    Volume<br>
    <input type="range" min="0" max="1" step="0.01" value="0.3" oninput="music.volume=this.value">
  </div>
</div>

<div id="hintBox"></div>

<div id="callScreen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:#8fe9ff; z-index:300; flex-direction:column; align-items:center; justify-content:center;">
<h2>Incoming Call...</h2>
<p>Vivian ♥</p>
<button onclick="endCall()">End Call</button>
</div>

<div id="galleryOverlay">
  <img id="galleryImage" src="">
  <p id="galleryNote"></p>
  <div>
    <button onclick="prevImage()">⬅️</button>
    <button onclick="nextImage()">➡️</button>
    <button onclick="closeGallery()">Close</button>
  </div>
</div>

<audio id="clickSound"><source src="click.mp3"></audio>
<audio id="music" loop><source src="music.mp3"></audio>
<audio id="engine"><source src="engine.mp3"></audio>
<audio id="ringtone" loop><source src="ringtone.mp3"></audio>

<div id="finalScene">
 <h1>Happy Birthday Lucas</h1>
 <p>See you on the road, hunter.</p>
 <img src="impala.png" id="finalCar">
</div>

<script>
// ---------- Загрузка ----------
let bootLines=[
"BOOTING HUNTER TERMINAL...",
"Loading Bobby Singer Archive...",
"Checking salt rounds...",
"Checking silver weapons...",
"Scanning monster database...",
"Accessing Men of Letters backup...",
"Decrypting hunter files...",
"Archive ready."
];
let bootIndex=0;
function bootSequence(){
 let text=document.getElementById("bootText");
 let bar=document.getElementById("bootBar");
 if(bootIndex<bootLines.length){
   text.innerHTML+=bootLines[bootIndex]+"\n";
   bar.style.width=((bootIndex+1)/bootLines.length*100)+"%";
   bootIndex++;
   setTimeout(bootSequence,700);
 } else {
   setTimeout(()=>{document.getElementById("bootScreen").style.display="none"},800);
 }
}
window.onload=bootSequence;

// ---------- Звук ----------
function clickSound(){
 let s=document.getElementById("clickSound");
 s.currentTime=0;
 s.play();
}
let music=document.getElementById("music");
function toggleAudio(){
 let panel=document.getElementById("audioPanel");
 panel.style.display = panel.style.display==="block" ? "none" : "block";
}

// ---------- Перевод ----------
let texts = {
 en:{
   subtitle:"Recovered hunter research database.",
   monsterFolder:"MONSTER FILES",
   lockedFolder:"LOCKED FILE",
   photoFolder:"PHOTO ARCHIVE",
   files:{
     vampire:`<h2>VAMPIRE / Vampire</h2><p>Vampires live in nests and replace missing people quietly.</p><p>Weakness: silver blade.</p><p>Bobby left coded word:</p><b>MFUUD</b><p>`,
     wendigo:`<h2>WENDIGO / Wendigo</h2><p>Ancient cannibal spirit living in forests.</p><p>Bobby left scrambled letters:</p><b>YTHDABRI</b><p>`,
     ghost:`<h2>GHOST / Ghost</h2><p>Lonely<br>Unfinished<br>Cold<br>Angry<br>Spirits</p>`,
     werewolf:`<h2>WEREWOLF / Werewolf</h2><p>Random notes Bobby accidentally saved here:</p><ul><li>Check salt traps at full moon.</li><li>Don’t forget holy water in first aid kit.</li><li>Random number: 42</li><li>Dean, come on! Tell your "angelic" friend to piss off! He always appears right in front of me when it's not needed.</li></ul>`,
     photodeantinder:`<h2>photodeantinder.jpeg</h2><img src="photodeantinder.jpeg" style="max-width:80%; margin-bottom:10px;"><p><b>Well, can anyone explain this to me?</b></p><p>Dean.<br><br>I accidentally found your Tinder profile.<br>And I haven't laughed like that in years.<br><br>Seriously — "loves pie and long drives"? Real smooth. Keep it up.<br><br>Don't let Sam see this. Ever.<br><br>— Bobby</p>`,
     unknown:`<h2>unknown.txt</h2><p>Sam. Dean.</p><p>If you're reading this, someone managed to break into my archive.</p><p>Name's Lucas Castro.</p><img src="profile.png" style="width:120px; border:1px solid #8fe9ff; margin-bottom:10px;"><p>Kid solved every damn lock I left here, so I guess that makes him a hunter now.</p><p>Funny thing is — looks like it happened on his birthday.</p><p>I managed to make it clean and deleted all case files from FBI system. Kiddo is a tough guy, so first things first.</p><h3>Hunter starter kit</h3><ul><li>Silver knife</li><li>Salt shells</li><li>EMF reader</li><li>Holy water</li><li>Devil's trap chalk</li><li>Fake FBI badge</li></ul><p><b>Bobby's note:</b></p><p>Dean — buy the kid pizza. He deserves it.</p>`,
     vivian:`<h2>vivian_message.txt</h2><div style="display:flex; gap:20px; align-items:flex-start;"><img src="vivian.jpeg" style="width:150px; border:1px solid #8fe9ff;"><div><p>Lucas.</p><p>You solved Bobby's archive. I knew you would.</p><p>Congratulations on becoming a hunter.</p><p>And happy birthday.</p><p>When the party ends, I want to take you somewhere.</p><p>A quiet highway outside the city.</p><p>We'll take the Impala, roll down the windows and drive under a sky full of stars.</p><p>No monsters. No hunting. Just the road and you.</p><p>Call me.</p><p><b style="cursor:pointer;" onclick="startCall()">📞 +1-913-555-1972</b></p><p>— Vivian ♥</p><button onclick="finalScene()">Finish</button></div></div>`
   },
   hints:{
     vampire:"Hint: Try decoding MFUUD using Caesar cipher with shift 5 to the left.",
     wendigo:"Hint: Rearrange the letters YTHDABRI to find the word.",
     ghost:"Hint: What if there's an acronym?",
     werewolf:"Hint: Theres no more hints! Smile suits you well."
   }
 },
 ru:{
   subtitle:"Архив охотника Бобби Сингера.",
   monsterFolder:"ФАЙЛЫ МОНСТРОВ",
   lockedFolder:"ЗАШИФРОВАННЫЙ ФАЙЛ",
   photoFolder:"ФОТОАРХИВ",
   files:{
     vampire:`<h2>Вампир / Vampire</h2><p>Вампиры живут в гнёздах и тихо заменяют пропавших людей.</p><p>Слабость: серебряный клинок.</p><p>Бобби оставил закодированное слово:</p><b>MFUUD</b><p>`,
     wendigo:`<h2>Вендиго / Wendigo</h2><p>Древний каннибальский дух, живущий в лесах.</p><p>Бобби оставил перепутанные буквы:</p><b>YTRHDABRI</b><p>`,
     ghost:`<h2>Призрак / Ghost</h2><p>Одинокий<br>Незавершённый<br>Холодный<br>Злой<br>Дух</p>`,
     werewolf:`<h2>WEREWOLF / Werewolf</h2><p>Случайные заметки Бобби,никто не знает, как они сюда попали:</p><ul><li>Проверить соляные ловушки при полной луне.</li><li>Не забудь святую воду в аптечке.</li><li>Случайное число: 42</li><li>Дин, убери от меня своего ангелочка. Он достал пугать своим резким появлением перед самым моим носом!</li></ul>`,
     photodeantinder:`<h2>photodeantinder.jpeg</h2><img src="photodeantinder.jpeg" style="max-width:80%; margin-bottom:10px;"><p><b>Эм, кто-нибудь мне объяснит, что здесь происходит?</b></p><p>Дин.<br><br>Я случайно нашёл твой профиль в Tinder.<br>Я так давно не смеялся от души!<br><br>Серьёзно — "любит пироги и длинные поездки"? Блестяще. Продолжай в том же духе.<br><br>Никогда не показывай это Сэму.<br><br>— Бобби</p>`,
     unknown:`<h2>unknown.txt</h2><p>Сэм. Дин.</p><p>Если вы читаете это, кто-то сумел взломать мой архив.</p><p>Его зовут Лукас Кастро.</p><img src="profile.png" style="width:120px; border:1px solid #8fe9ff; margin-bottom:10px;"><p>Пацан обошел все мои замки, так что теперь он охотник.</p><p>Забавное совпадение — похоже, это произошло в его день рождения.</p><p>Я очистил систему и удалил все дела из базы ФБР. Парень крепкий, так что сначала самое главное.</p><h3>Набор начинающего охотника</h3><ul><li>Серебряный нож</li><li>Соляные патроны</li><li>EMF-детектор</li><li>Святая вода</li><li>Мел для ловушек дьявола</li><li>Фальшивый значок ФБР</li></ul><p><b>Заметка Бобби:</b></p><p>Дин — купи парню пиццу. Он заслужил.</p>`,
     vivian:`<h2>vivian_message.txt</h2><div style="display:flex; gap:20px; align-items:flex-start;"><img src="vivian.jpeg" style="width:150px; border:1px solid #8fe9ff;"><div><p>Лукас.</p><p>Так значит, ты открыл архив Бобби? Я знал, что ты сможешь.</p><p>Поздравляю с тем, что стал охотником.</p><p>И с днём рождения.</p><p>Когда вечеринка закончится, я хочу отвезти тебя куда-то, что думаешь?</p><p>Тихая трасса за городом...</p><p>Мы возьмём Импалу, опустим окна и поедем под небом, полным звёзд.</p><p>Никаких монстров. Никакой охоты. Только дорога и ты.</p><p>Позвони мне.</p><p><b style="cursor:pointer;" onclick="startCall()">📞 +1-913-555-1972</b></p><p>— Вивиан ♥</p><button onclick="finalScene()">Finish</button></div></div>`
   },
   hints:{
     vampire:"Подсказка: Раскодируй MFUUD с помощью шифра Цезаря со сдвигом 5 влево.",
     wendigo:"Подсказка: Переставь буквы YTHDABRI, чтобы получить слово.",
     ghost:"Подсказка: Как насчет проверить документ на наличие акронима?",
     werewolf:"Подсказка: Тут больше нет подсказок, просто улыбнись, ведь тебе идёт."
   }
 }
};

let lang="en";
function toggleLang(){
 clickSound();
 lang=(lang==="en")?"ru":"en";
 document.getElementById("subtitle").innerHTML = texts[lang].subtitle;
 document.getElementById("monsterFolder").innerHTML = texts[lang].monsterFolder;
 document.getElementById("lockedFolder").innerHTML = texts[lang].lockedFolder;
 document.getElementById("photoFolder").innerHTML = texts[lang].photoFolder;

 let c=document.getElementById("content");
 if(c.dataset.fileType){
   if(texts[lang].files[c.dataset.fileType]){
     c.innerHTML=texts[lang].files[c.dataset.fileType];
   }
 }
}

// ---------- Файлы ----------
function openFile(type){
 clickSound();
 let c=document.getElementById("content");
 c.dataset.fileType=type;
 c.innerHTML=texts[lang].files[type];
}

// ---------- Подсказки ----------
function showHint(){
 clickSound();
 let c=document.getElementById("content");
 if(c.dataset.fileType && texts[lang].hints[c.dataset.fileType]){
   let box=document.getElementById("hintBox");
   box.innerText=texts[lang].hints[c.dataset.fileType];
   box.style.display="block";
   setTimeout(()=>{box.style.display="none"},4000);
 }
}

// ---------- Финальный файл ----------
function openFinal(){
 clickSound();
 let c=document.getElementById("content");
 c.dataset.fileType="unknown";
 c.innerHTML=`<p>Enter password:</p><p><i>hunter-word_word_word</i></p><input id="finalPass"><button onclick="checkFinal()">Decrypt</button>`;
}
function checkFinal(){
 let pass=document.getElementById("finalPass").value.toLowerCase();
 if(pass==="hunter-happy_birthday_lucas"){
   openFile("unknown");
   unlockVivian();
 } else{
   document.body.classList.add("glitch");
   setTimeout(()=>{document.body.classList.remove("glitch")},800);
   alert("Access denied");
 }
}

// ---------- Вивиан ----------
function unlockVivian(){
 document.getElementById("secretFolder").innerHTML=`
 <div class="folder">
 <strong>${lang==="en"?"PRIVATE MESSAGE":"ЧАСТНОЕ СООБЩЕНИЕ"}</strong>
 <div class="file" onclick="openVivian()">vivian_message.txt</div>
 </div>`;
}
function openVivian(){
 clickSound();
 let c=document.getElementById("content");
 c.dataset.fileType="vivian";
 c.innerHTML=texts[lang].files.vivian;
}

// ---------- Звонок ----------
function startCall(){
 clickSound();
 let screen=document.getElementById("callScreen");
 let ring=document.getElementById("ringtone");
 screen.style.display="flex";
 ring.play();
 setTimeout(()=>{
   screen.innerHTML=`
   <h2>Vivian ♥</h2>
   <p>Hey... you actually called.</p>
   <p>I was hoping you would.</p>
   <p>Get ready. I'm coming to pick you up.</p>
   <button onclick="endCall()">End Call</button>
   `;
 },4000);
}
function endCall(){
 document.getElementById("callScreen").style.display="none";
 document.getElementById("ringtone").pause();
}

// ---------- Галерея ----------
let galleryFiles = [
  {src:"photo1.jpeg", note:"You two look happy here, but stop peaking to cameras!"},
  {src:"photo2.jpeg", note:"Those eyes... Yeah, you're looking at our new security system. We're growing!"},
  {src:"photo3.jpeg", note:"Try not to get diarrhea after this... Well, at least you have a real angel by your side, Dean."},
  {src:"photo4.jpeg", note:"Dean, please stop screwing around in the bunker. What am I supposed to tell other hunters who find this?"},
  {src:"photo5.jpeg", note:"Late night snack, huh? Hope you two left some for me too."},
  {src:"gif1.gif", note:"Dear god, Dean! Again? Seriously? Nah, now this goes to your Tinder."},
  {src:"gif2.gif", note:"Dancing nicely, Winchester!"},
  {src:"gif3.gif", note:"God, are you flirting with a camera?"},
  {src:"gif4.gif", note:"Don't leave leftovers in your bed. You gonna smell bad!"},
  {src:"gif5.gif", note:"Money is great, isn't it?"}
];
let galleryIndex = 0;
function openGallery(){
 clickSound();
 galleryIndex=0;
 document.getElementById("galleryOverlay").style.display="flex";
 showGalleryImage();
}
function showGalleryImage(){
 let file = galleryFiles[galleryIndex];
 document.getElementById("galleryImage").src = file.src;
 document.getElementById("galleryNote").innerText = file.note;
}
function nextImage(){
 galleryIndex = (galleryIndex+1) % galleryFiles.length;
 showGalleryImage();
}
function prevImage(){
 galleryIndex = (galleryIndex-1 + galleryFiles.length) % galleryFiles.length;
 showGalleryImage();
}
function closeGallery(){
 document.getElementById("galleryOverlay").style.display="none";
}

// ---------- photodeantinder ----------
function openDean(){
 clickSound();
 openFile("photodeantinder");
}

// ---------- Финал ----------
function finalScene(){
 document.getElementById("finalScene").style.display="flex";
 document.getElementById("engine").play();
 createStars(100);
}
function createStars(count){
 for(let i=0;i<count;i++){
   let s=document.createElement("div");
   s.className="star";
   s.style.left=Math.random()*window.innerWidth+"px";
   s.style.top=Math.random()*window.innerHeight+"px";
   let size=Math.random()*2+1;
   s.style.width=size+"px";
   s.style.height=size+"px";
   s.style.animationDuration=(Math.random()*2+1)+"s";
   document.body.appendChild(s);
 }
}
</script>
</body>
</html>
